<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1090" viewBox="0 0 560 1090" role="img" aria-labelledby="title desc"><title id="title">ORC Canary: plan, review, dispatch, execute, assess</title><desc id="desc">Mobile-friendly vertical diagram. An external Codex proposes a task, Owner reviews it, Courier sends approved tasks to Secretary, ORC works in GitHub, and an external assessment informs a separate merge decision. Rejected plans stop.</desc><rect width="560" height="1090" rx="28" fill="#101827"/><text x="32" y="59" fill="#f4f8ff" font-family="Arial, sans-serif" font-size="38" font-weight="800">ORC CANARY</text><text x="32" y="92" fill="#b6c6dd" font-family="Arial, sans-serif" font-size="21">External quality probe · approval before dispatch</text><rect x="32" y="128" width="496" height="130" rx="18" fill="#1c293a" stroke="#344963" stroke-width="1.5"/><rect x="48" y="146" width="55" height="45" rx="12" fill="#67d4e7"/><text x="75" y="176" fill="#101827" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="800">01</text><text x="122" y="177" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="26" font-weight="750">PLAN</text><text x="51" y="216" fill="#dde8f6" font-family="Arial,sans-serif" font-size="21">GitHub issues or small source sample</text><text x="51" y="242" fill="#67d4e7" font-family="Arial,sans-serif" font-size="19">External Codex proposes a bounded task</text><path d="M280 260 v18" fill="none" stroke="#80a5c6" stroke-width="3"/><path d="M272 270 l8 9 8 -9" fill="none" stroke="#80a5c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="285" width="496" height="130" rx="18" fill="#1c293a" stroke="#344963" stroke-width="1.5"/><rect x="48" y="303" width="55" height="45" rx="12" fill="#f4c876"/><text x="75" y="333" fill="#101827" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="800">02</text><text x="122" y="334" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="26" font-weight="750">OWNER REVIEW</text><text x="51" y="373" fill="#dde8f6" font-family="Arial,sans-serif" font-size="21">Approve the proposal or reject it</text><text x="51" y="399" fill="#f4c876" font-family="Arial,sans-serif" font-size="19">REJECT → stop; no message is sent</text><path d="M280 417 v18" fill="none" stroke="#80a5c6" stroke-width="3"/><path d="M272 427 l8 9 8 -9" fill="none" stroke="#80a5c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="442" width="496" height="130" rx="18" fill="#1c293a" stroke="#344963" stroke-width="1.5"/><rect x="48" y="460" width="55" height="45" rx="12" fill="#67d4e7"/><text x="75" y="490" fill="#101827" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="800">03</text><text x="122" y="491" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="26" font-weight="750">DISPATCH</text><text x="51" y="530" fill="#dde8f6" font-family="Arial,sans-serif" font-size="21">courier send → secretary</text><text x="51" y="556" fill="#67d4e7" font-family="Arial,sans-serif" font-size="19">Only after explicit approval</text><path d="M280 574 v18" fill="none" stroke="#80a5c6" stroke-width="3"/><path d="M272 584 l8 9 8 -9" fill="none" stroke="#80a5c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="599" width="496" height="130" rx="18" fill="#1c293a" stroke="#344963" stroke-width="1.5"/><rect x="48" y="617" width="55" height="45" rx="12" fill="#9ab1ff"/><text x="75" y="647" fill="#101827" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="800">04</text><text x="122" y="648" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="26" font-weight="750">ORC EXECUTION</text><text x="51" y="687" fill="#dde8f6" font-family="Arial,sans-serif" font-size="21">Boss / workers produce a PR or commit</text><text x="51" y="713" fill="#9ab1ff" font-family="Arial,sans-serif" font-size="19">Actual work stays in the project repo</text><path d="M280 731 v18" fill="none" stroke="#80a5c6" stroke-width="3"/><path d="M272 741 l8 9 8 -9" fill="none" stroke="#80a5c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="756" width="496" height="130" rx="18" fill="#1c293a" stroke="#344963" stroke-width="1.5"/><rect x="48" y="774" width="55" height="45" rx="12" fill="#c4a5ff"/><text x="75" y="804" fill="#101827" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="800">05</text><text x="122" y="805" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="26" font-weight="750">ASSESS</text><text x="51" y="844" fill="#dde8f6" font-family="Arial,sans-serif" font-size="21">External review checks the GitHub diff</text><text x="51" y="870" fill="#c4a5ff" font-family="Arial,sans-serif" font-size="19">Review is not a test run or auto-merge</text><rect x="32" y="933" width="496" height="118" rx="18" fill="#163e42" stroke="#3b8f92" stroke-width="1.5"/><text x="54" y="974" fill="#a7f4dc" font-family="Arial,sans-serif" font-size="25" font-weight="750">MERGE IS A SEPARATE DECISION</text><text x="54" y="1009" fill="#e1f5ef" font-family="Arial,sans-serif" font-size="20">Owner reviews real evidence, tests and PR.</text><text x="54" y="1034" fill="#b6dbd0" font-family="Arial,sans-serif" font-size="18">Diagram = conceptual workflow, not a run log.</text></svg>